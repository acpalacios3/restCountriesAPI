<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>REST Countries</title>
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <h1>REST Countries</h1>
  <form id="searchForm" novalidate>

    <div class="form-group d-flex align-items-center mb-1">
      <label for="postTitle" class="form-label">Search Country</label>
      <input id="searchRegion" type="text" class="form-control w-50" placeholder="Enter country" required>

    </div>
  
    <button id="searchButton" type="submit" class="btn btn-primary">
      Search Country
    </button>

  </form>

  <div>
    <ul id="dataCountries"></ul>

  </div>

  <script type="module" src="./dist/dataCountries.js"></script>
</body>

</html>
