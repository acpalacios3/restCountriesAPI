<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- - Family: [fonts ](https://fonts.google.com/specimen/Nunito+Sans) -->
  <!-- - Weights: 300, 600, 800 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap"
    rel="stylesheet">

  <title>REST Countries</title>
  <link rel="stylesheet" href="./styles.css" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

  <header>
    <h1>Where in the World</h1>

    <button class="toggleColor" id="toggleColor">
      ☽ Dark Mode
    </button>

  </header>

  <main>

    <form id="searchForm" class="searchForm">

      <div class="countryContainer">
        <!-- label to display icon  and class="bi" use Bootstrap icons-->
        <i class="bi bi-search search-icon"></i>

        <input id="searchCountry" type="text" placeholder="Search for a country" aria-label="Search for a country">
      </div>

      <div class="regionContainer">


        <select id="searchRegion" aria-label="Filter by Region">
          <option value="">Filter by Region</option>
          <option value="Africa">Africa</option>
          <option value="Americas">Americas</option>
          <option value="Asia">Asia</option>
          <option value="Europe">Europe</option>
          <option value="Oceania">Oceania</option>
        </select>

      </div>

    </form>

    <section>

      <ul id="dataCountries"></ul>

    </section>

  </main>
  <script type="module" src="./dataCountries.js" defer></script>
   
</body>

</html>
